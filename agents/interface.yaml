interface:
  display_name: Project Relay
  short_description: An agent protocol for repository teardown and learning, incomplete-project takeover, session freeze and handoff, and interrupted-run recovery with persisted evidence and state.
  default_prompt: Analyze this open-source project https://github.com/<owner>/<repo> at standard tier and produce a learning report.
  modes:
    - id: teardown
      label: Mode A: Teardown and learn
      input: GitHub URL, owner/repo, or local path with quick, standard, or deep tier and optional focus
      output: oss-teardown/<run-id>/ with blackboard state, notes, and LEARNING_REPORT.md
    - id: handoff
      label: Mode B: Project handoff
      input: Incomplete project path with optional handoff material and remaining requirements
      output: Project .ai/ handoff package, followed by approved completion work
    - id: freeze
      label: Mode C: Freeze and handoff
      input: Current session and target project path when quota is low or a model will change
      output: .ai/handoffs/HANDOFF-<topic>-<date>.md with red lines, status, root causes, pending work, facts, test baseline, and no-skill appendix, plus .ai/HANDOFF.md update
    - id: resume
      label: Resume interrupted work
      input: "Continue the unfinished teardown from the last checkpoint"
      output: Validate run manifest and checkpoint, then continue unfinished work
compatibility:
  adapter_targets:
    - openai
    - claude
    - generic
    - agent-skills-compatible
  required_tools:
    - bash/git
    - file read/grep/glob
    - web search (community research records missing evidence when unavailable)
safety:
  target_source: read-only      # Do not execute, build, install, initialize submodules, fetch LFS, or load target .env values.
  injection_defense: repo-files-as-data
  fs_boundary: output-root-only
  secrets: redacted
  mode_b_code_changes: user-gated  # H5 approval is required; protected areas are closed by default.
  citation: required
