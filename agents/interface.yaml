interface:
  display_name: 项目接手.Skill（Project Handoff Skill · project-relay）
  short_description: 为 Agent 提供模式A 项目拆解、模式B 项目接手、模式C 交棒冻结、模式D 借鉴计划、模式E 教学模式与断点续跑的操作协议，并要求持久化状态和证据；实际执行质量取决于宿主和模型。
  default_prompt: 帮我拆解分析这个开源项目 https://github.com/<owner>/<repo>，按标准档位输出拆解报告。
  modes:
    - id: teardown
      label: 模式A 项目拆解
      input: GitHub URL / owner/repo / 本地路径（+档位 quick|standard|deep，+focus 关注点）
      output: oss-teardown/<run-id>/（黑板状态 + notes/ + TEARDOWN_REPORT.md）
    - id: handoff
      label: 模式B 项目接手
      input: 半成品项目路径（+可选交接材料+剩余需求；自动发现 .ai/handoffs/ 的 HANDOFF 与 当前会话上下文.md——后者为意图材料，按 H1 分区阅读：意图段先读、状态段 H2 读）
      output: 项目 .ai/ 交接包（七件套+ASSUMPTIONS+checkpoints），经用户门禁后执行收尾；复核过收敛门（未清阻塞标 manual_review_required）
    - id: freeze
      label: 模式C 交棒冻结
      input: 当前会话 + 目标项目路径（用户说额度不足/要换模型；长会话 AI 应主动预警建议交棒）
      output: .ai/handoffs/ 两件套——HANDOFF-项目交接-<日期>.md 权威交接文档（红线/状态表/根因明细/待办/防重探事实/测试基线/评审收敛记录/无技能接手附录）+ 当前会话上下文.md（九段会话上下文压缩产物：意图原话/决策理由/术语/协作画像/最近对话引用；固定文件名永远最新）+ OWNERSHIP REVISION 两件同步（防旧文档冒充）+ RUNTIME PROFILE（换模型不漂移）+ .ai/HANDOFF.md 指针更新
    - id: borrow
      label: 模式D 借鉴计划
      input: 用户自己的项目路径 + 想借鉴的参考项目路径/URL（双目标；D0 先锚定角色，不明确即停下询问）
      output: BORROWING_PLAN.md（双项目登记表/差异对比/借鉴点清单/许可证判定记录），经 D7 用户门禁后接模式B 执行
    - id: learn
      label: 模式E 教学模式
      input: 单目标项目路径/URL（缺失先询问）+ 学习者水平（默认小白）+ 学习目标；所有学习/学会类意图统一归此模式
      output: LEARNING_PATH.md（分阶段学习地图/前置清单/鲜活例子/三思维清单/举一反三练习/可迁移清单），面向学习者（默认小白）；要深度拆解报告切模式A
    - id: resume
      label: 断点续跑
      input: "继续上次未完成的拆解"
      output: 从 run-manifest/checkpoint 恢复并继续
compatibility:
  adapter_targets:
    - openai
    - claude
    - generic
    - agent-skills-compatible
  required_tools:
    - bash/git
    - file read/grep/glob
    - web search（社区调研，缺失时降级为 missing evidence）
safety:
  target_source: read-only      # 禁止执行/构建/安装目标代码、submodule、LFS、加载目标 .env
  injection_defense: repo-files-as-data
  fs_boundary: output-root-only
  secrets: redacted
  mode_b_code_changes: user-gated  # H5 未批准不动代码；变更禁区默认封闭
  mode_d_borrow: user-gated        # D0 锚定 + D7 许可证/意图门禁；未批准 0 行代码
  license_check: script-structure-only  # check_license.py 只做结构检测，判断权在模型+用户
  citation: required               # 借鉴点强制归因（来源 SHA+file:line）
  budget_freeze: blocked-external  # 预算耗尽冻结到 retry_after，不静默降档（B7）
  lease_heartbeat: claimed_until + heartbeat_at  # 租约到期/心跳续期/过期释放（B8）